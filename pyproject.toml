[project]
name = "school-management-system-lite"
version = "0.1.0"
description = "School Management System Lite"
readme = "README.md"
authors = [
    { name = "Muslimjon", email = "mnvrv.mm@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.5.6",
    "passlib>=1.7.4",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "ua-parser>=1.0.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "aiosmtplib>=5.1.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
